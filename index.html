<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binary Tree AAC Speller</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container" id="app" tabindex="0" aria-label="AAC speller input area">
      <h1>Binary Tree AAC Speller</h1>
      <p>
        Use only <strong>Left</strong> and <strong>Right</strong> arrow keys to navigate the tree.
        Pause briefly to commit the currently selected letter.
      </p>
      <p class="hint">Click anywhere on this panel once, then use arrow keys.</p>

      <section class="status" aria-live="polite">
        <div><span class="label">Current path:</span> <span id="path">(root)</span></div>
        <div><span class="label">Current letter:</span> <span id="current-letter">-</span></div>
      </section>

      <section>
        <h2>Typed Text</h2>
        <div id="typed-text" class="typed-text"></div>
        <button id="clear-btn" type="button">Clear</button>
      </section>

      <section>
        <h2>Alphabet Binary Tree</h2>
        <ul id="tree" class="tree"></ul>
      </section>

      <section>
        <h2>Letter Codes</h2>
        <div id="codes" class="codes"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
